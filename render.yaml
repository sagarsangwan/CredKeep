services:
  - type: web
    name: credkeep-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py migrate
    startCommand: gunicorn credkeep_backend.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/v2/health/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.13.1

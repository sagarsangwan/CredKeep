services:
  - type: web
    name: credkeep-v2-staging
    runtime: docker
    repo: https://github.com/sagarsangwan/CredKeep
    branch: staging
    region: singapore
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    autoDeployTrigger: 'off'
    healthCheckPath: /api/v2/ready/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1"
      - key: DATABASE_URL
        sync: false

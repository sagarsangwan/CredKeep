name: credkeep

services:
  db:
    image: postgres:15-alpine
    container_name: credkeep_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-credkeep_v2}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      APP_DB_USER: ${APP_DB_USER:-credkeep_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set in .env}
    ports:
      # Bound to 127.0.0.1 only to avoid exposing database port to local network
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-credkeep_v2}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migration:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: credkeep_migration
    restart: "no"
    env_file:
      - path: .env
        required: false
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-credkeep_v2}
    command: python manage.py migrate --noinput
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: credkeep_backend
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${DOCKER_ALLOWED_HOSTS:-${ALLOWED_HOSTS:-localhost,127.0.0.1},backend,10.0.2.2,host.docker.internal${LAN_IP:+,${LAN_IP}}}
      DATABASE_URL: postgres://${APP_DB_USER:-credkeep_app}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-credkeep_v2}
      PORT: 8000
      PYTHONUNBUFFERED: "1"
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v2/health/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
    driver: local
